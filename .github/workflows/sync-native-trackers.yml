name: Sync Native Tracker lists
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-native-trackers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: myclash-rules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and sync upstream lists
        run: node tools/defense-sync/sync-native-trackers.mjs
      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/native-vivo.txt ruleset/native-huawei.txt
          if git diff --cached --quiet; then
            echo "Native Tracker lists are already up to date."
            exit 0
          fi
          git commit -m "chore: sync HaGeZi native tracker lists"
          git push
