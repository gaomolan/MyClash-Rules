hosts!:
  doh.pub:
  - 1.12.12.12
  - 120.53.53.53
  cloudflare-dns.com:
  - 1.1.1.1
  - 1.0.0.1
  dns.google:
  - 8.8.8.8
  - 8.8.4.4
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com:
  - 0.0.0.0
  +.mcdn.bilivideo.cn:
  - 0.0.0.0
  +.edge.mountaintoys.cn:
  - 0.0.0.0
  +.h2.smtcdns.net:
  - 0.0.0.0
dns:
  enable: true
  ipv6: false
  use-hosts: true
  cache-algorithm: arc
  prefer-h3: false
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter:
  - rule-set:private
  - rule-set:fakeip_filter
  - rule-set:cn
  - rule-set:googlefcm
  default-nameserver:
  - 114.114.114.114#DIRECT
  - https://1.12.12.12/dns-query#DIRECT
  proxy-server-nameserver:
  - 114.114.114.114#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver:
  - https://cloudflare-dns.com/dns-query#默认代理
  - https://dns.google/dns-query#默认代理
  nameserver-policy:
    rule-set:private: system
    rule-set:douyin:
    - system
    - 180.184.1.1
    - 180.184.2.2
    rule-set:cn:
    - 119.29.29.29#DIRECT
    - 114.114.114.114#DIRECT
  direct-nameserver:
  - 119.29.29.29#DIRECT
  - 114.114.114.114#DIRECT
  direct-nameserver-follow-policy: true
  respect-rules: true
  fake-ip-ttl: 2
profile:
  store-selected: true
  store-fake-ip: true
geox-url:
  geoip: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://cdn.jsdmirror.com/gh/appshubcc/bett-rules@release/geoip.metadb
  asn: https://github.com/appshubcc/bett-rules/releases/download/latest/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 168
etag-support: true
ipv6: false
keep-alive-interval: 30
unified-delay: true
tcp-concurrent: true
geodata-loader: memconservative

