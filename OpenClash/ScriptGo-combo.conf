[General]
ENABLE_CUSTOM_DNS = 1
ENABLE_RESPECT_RULES = 1
ENABLE_META_SNIFFER = 1
DISABLE_UDP_QUIC = 0
IPV6_ENABLE = 0
IPV6_DNS = 0
#!NAME = ScriptGo-combo-remote
#!DESC = Combo rules and groups for spark-cxue subscription; no node credentials
#!CONFIG = spark-cxue.yaml
#!CRON = * 4

[YAML]
proxies*:
  where:
    type: /^(ss|vless)$/
  set:
    ip-version: ipv4-prefer
proxies+:
- name: 🇨🇳 直连 | 双栈
  type: direct
- name: 🇨🇳 直连 | IPv4优先
  type: direct
  ip-version: ipv4-prefer
- name: 🇨🇳 直连 | IPv6优先
  type: direct
  ip-version: ipv6-prefer
- name: 🇨🇳 直连 | 仅IPv4
  type: direct
  ip-version: ipv4
- name: 🇨🇳 直连 | 仅IPv6
  type: direct
  ip-version: ipv6
proxy-groups!:
